<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>總經 & 情緒</title>
<style>
:root { color-scheme: light; --bg:#0e1116; --surface:#161a21; --surface-2:#1c2128; --border:#2a2f38; --border-bright:#3a4150; --btc:#f7931a; --eth:#6a7fff; --price:#00d4ff; --text:#e6e6e6; --text-mid:#b5bac4; --text-dim:#8b95a3; --text-faint:#5d6675; --success:#4ade80; --warn:#f59e0b; --danger:#ef4444; --accent:#5dadec; --purple:#a78bfa; --sans:'Inter',system-ui,sans-serif; --mono:'JetBrains Mono',monospace; }
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:var(--sans); background:var(--bg); color:var(--text); font-size:14px; line-height:1.55; padding:24px; }
.dashboard { max-width:1400px; margin:0 auto; display:flex; flex-direction:column; gap:18px; }
.status-bar { display:flex; justify-content:space-between; padding:8px 14px; background:var(--surface); border:1px solid var(--border); border-radius:8px; font-size:11px; color:var(--text-dim); font-family:var(--mono); }
.status-bar .live { color:var(--success); }
.status-bar .live::before { content:'● '; }
.hero { padding:22px 26px; background:var(--surface); border:1px solid var(--border); border-radius:10px; }
.hero h1 { font-size:28px; font-weight:600; }
.hero h1 .tag { font-family:var(--mono); font-size:12px; color:var(--text-dim); font-weight:400; margin-left:12px; }
.hero .subtitle { margin-top:4px; font-size:13px; color:var(--text-mid); }
.hero .accent { color:var(--accent); }
.tab-bar { display:flex; gap:4px; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:6px; }
.tab-btn { flex:1; padding:11px 18px; background:transparent; border:1px solid transparent; color:var(--text-dim); font-size:13px; font-weight:500; cursor:pointer; border-radius:7px; }
.tab-btn.active { background:var(--surface-2); color:var(--text); border-color:var(--border-bright); }
.tab-btn .badge { font-family:var(--mono); font-size:10px; padding:2px 6px; border-radius:3px; background:rgba(255,255,255,0.06); color:var(--text-dim); margin-left:8px; }
.tab-panel { display:none; flex-direction:column; gap:18px; }
.tab-panel.active { display:flex; }
.metrics { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }
.metric { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:16px 18px; position:relative; overflow:hidden; }
.metric::before { content:''; position:absolute; top:0; left:0; width:3px; height:28px; background:var(--text-faint); border-radius:0 2px 2px 0; }
.metric.btc::before { background:var(--btc); } .metric.eth::before { background:var(--eth); } .metric.warn::before { background:var(--warn); } .metric.danger::before { background:var(--danger); } .metric.success::before { background:var(--success); } .metric.accent::before { background:var(--accent); } .metric.purple::before { background:var(--purple); }
.metric .label { font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.06em; margin-bottom:8px; }
.metric .value { font-family:var(--mono); font-size:28px; font-weight:600; line-height:1; }
.metric.btc .value { color:var(--btc); } .metric.eth .value { color:var(--eth); }
.metric .value.med { font-size:22px; } .metric .value.small { font-size:18px; }
.metric .sub { margin-top:8px; font-size:12px; color:var(--text-mid); display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.tag-band { display:inline-block; padding:2px 8px; border-radius:4px; font-size:10.5px; font-weight:600; }
.t-fear { background:rgba(245,158,11,0.15); color:#f5b042; }
.t-extreme_fear { background:rgba(239,68,68,0.15); color:#ff6b6b; }
.t-neutral { background:rgba(139,149,163,0.15); color:var(--text-mid); }
.t-greed { background:rgba(74,222,128,0.15); color:var(--success); }
.t-euphoric { background:rgba(93,173,236,0.18); color:var(--accent); }
.regime-tag { display:inline-block; padding:3px 9px; border-radius:4px; font-size:10.5px; font-weight:600; }
.r-good { background:rgba(74,222,128,0.15); color:var(--success); }
.r-pressure { background:rgba(245,158,11,0.18); color:var(--warn); }
.r-danger { background:rgba(239,68,68,0.18); color:var(--danger); }
.r-na { background:rgba(139,149,163,0.15); color:var(--text-dim); }
.delta { font-family:var(--mono); font-size:11.5px; }
.delta.pos { color:var(--success); } .delta.neg { color:var(--danger); } .delta.flat { color:var(--text-dim); }
.card { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:22px 24px; }
.card .head { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:16px; padding-bottom:12px; border-bottom:1px solid var(--border); }
.card .title { font-size:13px; font-weight:600; }
.card .meta { font-family:var(--mono); font-size:11px; color:var(--text-dim); }
.indicator-explain { margin-top:10px; font-size:11.5px; color:var(--text-mid); padding:8px 10px; background:rgba(255,255,255,0.02); border-radius:5px; border-left:2px solid var(--text-faint); }
.indicator-explain.warn { border-left-color:var(--warn); }
.indicator-explain.good { border-left-color:var(--success); }
.indicator-explain.danger { border-left-color:var(--danger); }
.indicator-explain strong { color:var(--text); }
.chart-wrap { max-width:880px; margin:0 auto; height:280px; }
.brief-row { display:grid; gap:12px; }
.brief-row.r2 { grid-template-columns:repeat(2,1fr); } .brief-row.r3 { grid-template-columns:repeat(3,1fr); } .brief-row.r4 { grid-template-columns:repeat(4,1fr); }
.alert-banner { padding:13px 18px; border-radius:8px; display:flex; gap:12px; font-size:13.5px; line-height:1.55; align-items:center; }
.alert-banner .big { font-size:22px; }
.alert-banner.warn { background:rgba(245,158,11,0.08); border:1px solid rgba(245,158,11,0.25); color:var(--warn); }
.alert-banner.danger { background:rgba(239,68,68,0.08); border:1px solid rgba(239,68,68,0.25); color:#ff8585; }
.alert-banner.success { background:rgba(74,222,128,0.08); border:1px solid rgba(74,222,128,0.30); color:var(--success); }
.alert-banner b { color:var(--text); }
.layer1-grid { display:flex; flex-direction:column; gap:10px; margin-top:8px; }
.layer1-cond { display:flex; gap:14px; padding:12px 16px; background:var(--surface-2); border:1px solid var(--border); border-left:3px solid; border-radius:6px; align-items:center; }
.layer1-cond.pass { border-left-color:var(--success); }
.layer1-cond.fail { border-left-color:var(--danger); }
.cond-num { font-family:var(--mono); font-size:20px; font-weight:700; width:26px; text-align:center; }
.layer1-cond.pass .cond-num { color:var(--success); } .layer1-cond.fail .cond-num { color:var(--danger); }
.cond-content { flex:1; } .cond-rule { font-size:13px; font-weight:500; } .cond-current { font-family:var(--mono); font-size:11.5px; color:var(--text-dim); margin-top:4px; }
.cond-status { font-size:12px; font-weight:600; padding:4px 10px; border-radius:4px; font-family:var(--mono); }
.layer1-cond.pass .cond-status { color:var(--success); background:rgba(74,222,128,0.12); }
.layer1-cond.fail .cond-status { color:var(--danger); background:rgba(239,68,68,0.12); }
.section-label { margin-top:18px; padding:8px 14px; border-radius:4px; font-size:11.5px; color:var(--text-mid); font-family:var(--mono); }
.section-label.req { background:rgba(93,173,236,0.06); border-left:3px solid var(--accent); }
.section-label.bonus { background:rgba(245,158,11,0.06); border-left:3px solid var(--warn); }
.news-item { display:flex; gap:12px; padding:12px 0; border-bottom:1px solid var(--border); }
.news-item:last-child { border-bottom:none; }
.news-dot { flex-shrink:0; width:10px; height:10px; border-radius:50%; margin-top:6px; }
.news-dot.high { background:var(--danger); } .news-dot.med { background:var(--warn); }
.news-title { font-size:13px; color:var(--text); font-weight:500; }
.calendar { display:flex; flex-direction:column; gap:14px; }
.cal-day { background:var(--surface-2); border:1px solid var(--border); border-radius:8px; padding:14px 16px; }
.cal-day.today { border-color:var(--accent); }
.cal-day-header { display:flex; gap:10px; margin-bottom:10px; padding-bottom:8px; border-bottom:1px dashed var(--border); }
.cal-day-date { font-size:14px; font-weight:600; font-family:var(--mono); }
.cal-day-label { font-size:11px; color:var(--text-dim); padding:2px 8px; background:rgba(255,255,255,0.04); border-radius:4px; }
.cal-day.today .cal-day-label { background:rgba(93,173,236,0.20); color:var(--accent); }
.cal-event { display:flex; gap:12px; padding:7px 0; }
.cal-event-time { width:90px; font-family:var(--mono); font-size:11.5px; color:var(--text-dim); }
.cal-event-content { flex:1; font-size:13px; color:var(--text-mid); }
.cal-event-tag { padding:1px 6px; font-size:10px; font-family:var(--mono); border-radius:3px; margin-left:6px; }
.cal-event-tag.fed { background:rgba(239,68,68,0.18); color:#ff8585; }
.cal-event-tag.crypto { background:rgba(247,147,26,0.18); color:var(--btc); }
.coin-grid { display:grid; grid-template-columns:repeat(5,1fr); gap:10px; padding:8px 0; }
.coin-card { padding:14px 10px; background:var(--surface-2); border-left:3px solid var(--accent); border-radius:6px; text-align:center; }
.coin-card.c3 { border-left-color:var(--success); }
.coin-card .cc-tag { font-size:10.5px; color:var(--text-dim); }
.coin-card.c3 .cc-tag { color:var(--success); }
.coin-card .cc-sym { font-family:var(--mono); font-size:18px; font-weight:600; margin-top:4px; color:var(--accent); }
.coin-card.c3 .cc-sym { color:var(--warn); }
.coin-card .cc-ret { font-size:10px; color:var(--text-faint); margin-top:3px; }
.sop-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; padding:6px 0; }
.sop-box { padding:12px 14px; background:var(--surface-2); border-radius:6px; }
.sop-box.in { border-left:3px solid var(--success); }
.sop-box.out { border-left:3px solid var(--danger); }
.sop-box .sop-h { font-size:13px; font-weight:600; margin-bottom:6px; }
.sop-box.in .sop-h { color:var(--success); } .sop-box.out .sop-h { color:var(--danger); }
.sop-box .sop-b { font-size:12.5px; color:var(--text-mid); line-height:1.55; }
.foot { text-align:center; font-family:var(--mono); font-size:11px; color:var(--text-faint); padding-top:8px; }
.loading { text-align:center; padding:60px; color:var(--text-dim); }
@media (max-width:900px) {
  .metrics, .brief-row.r4, .coin-grid { grid-template-columns:repeat(2,1fr); }
  .brief-row.r3, .brief-row.r2, .sop-grid { grid-template-columns:1fr; }
  body { padding:14px; }
}
</style>
</head>
<body>
<div class="dashboard">
  <div class="status-bar">
    <div><span class="live">LIVE</span> &nbsp;總經 &amp; 情緒 &nbsp; <span id="hdrDate">—</span></div>
    <div><span id="tpeClock">—</span> &nbsp; v6.1</div>
  </div>
  <div class="hero">
    <h1>總經 &amp; 情緒 <span class="tag">// 每日交易駕駛艙</span></h1>
    <div class="subtitle">每天 08:00(台北)自動更新 · <span class="accent">早盤總經 + X 情緒 + 小幣框架 + 強勢幣 Top 10</span></div>
  </div>
  <div class="tab-panel active" id="tab-sentiment"><div class="loading">載入中…</div></div>
  <div class="tab-panel active" id="tab-brief"></div>
  <div class="tab-panel active" id="tab-strong"></div>
  <div class="foot" id="foot">—</div>
</div>

<script>
const BAND_ZH = { extreme_fear:'極度恐懼', fear:'恐懼', neutral:'中性', greed:'貪婪', euphoric:'狂熱' };
const VERDICT = {
  'ALT-OFF':      { cls:'danger',  icon:'🔴',     label:'ALT-OFF',      act:'現金為主，不開新小幣倉' },
  'GO':           { cls:'success', icon:'🟢',     label:'GO',           act:'可開始佈局強勢小幣' },
  'STRONG GO':    { cls:'success', icon:'🟢🟢',   label:'STRONG GO',    act:'強勢訊號，積極佈局' },
  'FULL GO':      { cls:'success', icon:'🟢🟢🟢', label:'FULL GO',      act:'全面進攻' }
};
const STATUS_ZH = { c3:'🔔 連續候選', hold:'留守', up:'↑ 上升', down:'↓ 下降', reenter:'🔄 重返', new:'🆕 新進' };
const fmtPct = v => v==null ? '' : `<span class="delta ${v>0?'pos':v<0?'neg':'flat'}">${v>0?'+':''}${v.toFixed(2)}% 1D</span>`;
const fmtNum = (v,d=2,suf='') => v==null ? '—' : v.toFixed(d)+suf;
const esc = s => String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

function tickClock(){ const d=new Date(); const t=new Date(d.getTime()+(d.getTimezoneOffset()+480)*60000); document.getElementById('tpeClock').textContent='TPE '+String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0'); }
function switchTab(n){ document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active',b.dataset.tab===n)); document.querySelectorAll('.tab-panel').forEach(p=>p.classList.toggle('active',p.id==='tab-'+n)); }

function c3List(d){
  const s = d.strong || {};
  const fromStatus = (s.top10||[]).filter(c=>c.status==='c3').map(c=>c.sym);
  return fromStatus.length ? fromStatus : (s.c3_entry||[]);
}
function verdictBanner(d){
  const v = VERDICT[d.verdict] || VERDICT['ALT-OFF'];
  const s = d.strong || {};
  const c3 = c3List(d);
  let c3line = '';
  if (c3.length){
    const armed = (d.verdict !== 'ALT-OFF');
    c3line = ` &nbsp;·&nbsp; 🔔 ${esc(c3.join('+'))} 連 ${s.c3_day||3} 天` + (armed ? '（達標可進場）' : '（框架未開，記錄觀察）');
  }
  let evline = '';
  const fed = ((d.calendar||{}).today||[]).find(e=>e.tag==='fed');
  if (fed) evline = ` &nbsp;·&nbsp; ⚠️ 今日${esc(String(fed.event).split('(')[0])}（數據前後 4h 棄權）`;
  return `<div class="alert-banner ${v.cls}"><span class="big">${v.icon}</span><div style="flex:1"><b>${v.label} · ${v.act}</b>${c3line}${evline}</div></div>`;
}

function renderSentiment(d){
  const x = d.x || {};
  const btc = x.btc||{}, eth = x.eth||{};
  const el = document.getElementById('tab-sentiment');
  el.innerHTML =
    verdictBanner(d) +
    `<div class="metrics">
      <div class="metric btc"><div class="label">BTC 情緒分數</div><div class="value">${btc.score!=null?btc.score.toFixed(1):'—'}</div>
        <div class="sub">${btc.band?`<span class="tag-band t-${btc.band}">${BAND_ZH[btc.band]||btc.band}</span>`:''}${btc.delta_1d!=null?`<span class="delta ${btc.delta_1d>0?'pos':'neg'}">${btc.delta_1d>0?'+':''}${btc.delta_1d.toFixed(1)} 1D</span>`:''}</div></div>
      <div class="metric eth"><div class="label">ETH 情緒分數</div><div class="value">${eth.score!=null?eth.score.toFixed(1):'—'}</div>
        <div class="sub">${eth.band?`<span class="tag-band t-${eth.band}">${BAND_ZH[eth.band]||eth.band}</span>`:''}${eth.delta_1d!=null?`<span class="delta ${eth.delta_1d>0?'pos':'neg'}">${eth.delta_1d>0?'+':''}${eth.delta_1d.toFixed(1)} 1D</span>`:''}</div></div>
      <div class="metric accent"><div class="label">BTC 價</div><div class="value med">${x.btc_price!=null?'$'+(x.btc_price/1000).toFixed(2)+'k':'—'}</div><div class="sub">${fmtPct(x.btc_price_delta_pct)}</div></div>
      <div class="metric purple"><div class="label">ETH 價</div><div class="value med">${x.eth_price!=null?'$'+x.eth_price.toLocaleString():'—'}</div><div class="sub">${fmtPct(x.eth_price_delta_pct)}</div></div>
    </div>` +
    '';
}

function renderBrief(d){
  const m = d.macro||{}, dm = d.dominance||{};
  const el = document.getElementById('tab-brief');
  const naTag = v => v==null ? '<span class="regime-tag r-na">資料源暫缺</span>' : '';
  const v = VERDICT[d.verdict] || VERDICT['ALT-OFF'];
  const band3 = (val,lo,hi,tLo,tMid,tHi) => val==null ? naTag(null) :
    (val<lo ? `<span class="regime-tag r-good">🟢 ${tLo}</span>` : val<=hi ? `<span class="regime-tag r-pressure">🟡 ${tMid}</span>` : `<span class="regime-tag r-danger">🔴 ${tHi}</span>`);
  const etfVal = m.etf_flow!=null ? m.etf_flow : m.etf_flow_last;
  const etfTag = etfVal==null ? naTag(null) : (etfVal>=0 ? '<span class="regime-tag r-good">🟢 流入</span>' : '<span class="regime-tag r-danger">🔴 流出</span>')+'<span class="regime-tag r-na">最新公布</span>';

  // Macro cards (判讀門檻寫死前端,不經 agent)
  const macroCards = `<div class="brief-row r4">
    <div class="metric warn"><div class="label">VIX</div><div class="value med">${fmtNum(m.vix,2)}</div><div class="sub">${band3(m.vix,16,22,'平靜','中性','警戒')}</div></div>
    <div class="metric accent"><div class="label">MOVE</div><div class="value med">${fmtNum(m.move,2)}</div><div class="sub">${band3(m.move,80,100,'平靜','偏高','緊張')}</div></div>
    <div class="metric accent"><div class="label">DXY 美元</div><div class="value med">${m.dxy!=null?fmtNum(m.dxy,2):(m.dxy_last!=null?fmtNum(m.dxy_last,2):'—')}</div><div class="sub">${band3(m.dxy!=null?m.dxy:m.dxy_last,95,105,'偏弱','中性','強勢壓制')}</div></div>
    <div class="metric purple"><div class="label">10Y TIPS 實質</div><div class="value med">${fmtNum(m.tips,2,'%')}</div><div class="sub">${band3(m.tips,1,2,'寬鬆','中性','偏緊')}</div></div>
  </div>
  <div class="brief-row r2" style="margin-top:12px">
    <div class="metric warn"><div class="label">BTC ETF 1D 淨流入</div><div class="value med small">${etfVal!=null?(etfVal<0?'-$':'+$')+Math.abs(etfVal)+'M':'—'}</div><div class="sub">${etfTag}</div></div>
    <div class="metric"><div class="label">BTC-NDX 相關 (30D)</div><div class="value med">${m.ndx_corr_30d!=null?m.ndx_corr_30d.toFixed(2):'—'}</div><div class="sub">${band3(m.ndx_corr_30d,0.3,0.6,'低連動','中度連動','高連動')}</div></div>
  </div>`;

  // Dominance cards
  const reqOk = b => b ? 'pass' : 'fail', reqMk = b => b ? '✓ PASS' : '✗ FAIL';
  const domCards = `<div class="brief-row r4">
    <div class="metric btc"><div class="label">BTC.D</div><div class="value med">${fmtNum(dm.btc_d,1,'%')}</div><div class="sub"><span class="delta ${dm.btc_d_delta7==null?'flat':dm.btc_d_delta7<0?'pos':'neg'}">Δ7d ${dm.btc_d_delta7==null?'—':dm.btc_d_delta7.toFixed(2)+'pp'}</span></div></div>
    <div class="metric accent"><div class="label">OTHERS.D</div><div class="value med">${fmtNum(dm.others_d,2,'%')}</div><div class="sub"><span class="regime-tag ${dm.bonus_c?'r-good':'r-pressure'}">${dm.bonus_c?'🟢 >12%':'🔴 <12%'}</span></div></div>
    <div class="metric purple"><div class="label">TOTAL3.D</div><div class="value med">${fmtNum(dm.total3_d,1,'%')}</div><div class="sub"></div></div>
    <div class="metric warn"><div class="label">ETH/BTC</div><div class="value med">${dm.ethbtc!=null?dm.ethbtc.toFixed(5):'—'}</div><div class="sub"></div></div>
  </div>
  <div style="margin-top:12px"><div class="metric danger"><div class="label">Alt Momentum (7D)</div><div class="value med">${fmtNum(dm.alt_mom7,1,'%')}</div><div class="sub"><span class="regime-tag ${dm.req2?'r-good':'r-danger'}">${d.verdict}</span>${dm.breadth_pct!=null?`<span class="delta">breadth ${dm.breadth_pct.toFixed(0)}%</span>`:''}</div></div></div>`;

  // Layer1 conditions (rules hardcoded; pass/fail from booleans)
  const dppCur = dm.btc_d_delta7==null ? '—' : dm.btc_d_delta7.toFixed(2)+'pp';
  const altCur = dm.alt_mom7==null ? '—' : (dm.alt_mom7>0?'+':'')+dm.alt_mom7.toFixed(1)+'%';
  const reqRows = [
    {n:'1', ok:dm.req1, rule:'BTC.D 7D 方向往下 (Δ7d < 0)', cur:'目前 Δ7d '+dppCur},
    {n:'2', ok:dm.req2, rule:'Alt basket 7D 平均 > 0%', cur:'目前 '+altCur}
  ];
  const bonusRows = [
    {n:'a', ok:dm.bonus_a, rule:'BTC.D Δ7d ≤ -0.5pp (實質下行)', cur:'目前 Δ7d '+dppCur},
    {n:'b', ok:dm.bonus_b, rule:'Alt basket 7D > +1.5% (動能明顯)', cur:'目前 '+altCur},
    {n:'c', ok:dm.bonus_c, rule:'OTHERS.D > 12% (啟動線)', cur:'目前 '+(dm.others_d==null?'—':dm.others_d.toFixed(2)+'%')}
  ];
  const condHtml = rows => rows.map(r=>`<div class="layer1-cond ${reqOk(r.ok)}"><div class="cond-num">${r.n}</div><div class="cond-content"><div class="cond-rule">${r.rule}</div><div class="cond-current">${r.cur}</div></div><div class="cond-status">${reqMk(r.ok)}</div></div>`).join('');

  // News + calendar
  const news = (d.news||[]).map(n=>`<div class="news-item"><div class="news-dot ${n.sev==='high'?'high':'med'}"></div><div><div class="news-title">${esc(n.title)}</div></div></div>`).join('');
  const cal = d.calendar||{};
  const calToday = (cal.today||[]).map(e=>`<div class="cal-event"><div class="cal-event-time">${esc(e.time)}</div><div class="cal-event-content">${esc(e.event)} ${e.tag?`<span class="cal-event-tag ${e.tag}">${e.tag.toUpperCase()}</span>`:''}</div></div>`).join('');
  const calWeek = (cal.week||[]).map(e=>`<div class="cal-day"><div class="cal-day-header"><span class="cal-day-date">${esc(e.date)}</span></div><div class="cal-event"><div class="cal-event-time">—</div><div class="cal-event-content">${esc(e.event)} ${e.tag?`<span class="cal-event-tag ${e.tag}">${e.tag.toUpperCase()}</span>`:''}</div></div></div>`).join('');

  el.innerHTML =
    `<div class="card"><div class="head"><div class="title">🌐 整體市場資金面</div><div class="meta">macro / risk</div></div>${macroCards}</div>` +
    `<div class="card"><div class="head"><div class="title">🎯 小幣框架 (Layer 1 v2)</div><div class="meta">2 必要 + 3 加分</div></div>${domCards}
      <div class="section-label req">必要條件（2 全過 = ALT-ON，任一 fail = ALT-OFF）</div><div class="layer1-grid">${condHtml(reqRows)}</div>
      <div class="section-label bonus">加分條件（每過 1 條升一級 verdict）</div><div class="layer1-grid">${condHtml(bonusRows)}</div></div>` +
    `<div class="card"><div class="head"><div class="title">過去 24h 重要新聞</div><div class="meta">🔴 高 · 🟡 中</div></div>${news}</div>` +
    `<div class="card"><div class="head"><div class="title">今日 + 本週日曆</div><div class="meta">macro · crypto</div></div><div class="calendar"><div class="cal-day today"><div class="cal-day-header"><span class="cal-day-date">${esc(d.date?d.date.slice(5):'')} ${esc(d.weekday||'')}</span><span class="cal-day-label">今日</span></div>${calToday}</div>${calWeek}</div></div>`;
}

function renderStrong(d){
  const s = d.strong||{};
  const el = document.getElementById('tab-strong');
  const win = s.window || '30D';
  const cards = (s.top10||[]).map(c=>`<div class="coin-card ${c.status==='c3'?'c3':''}"><div class="cc-tag">#${c.rank} ${STATUS_ZH[c.status]||''}</div><div class="cc-sym">${esc(c.sym)}</div><div class="cc-ret">${c.ret!=null?(c.ret>0?'+':'')+c.ret.toFixed(1)+'%':'—'}</div></div>`).join('');
  const c3 = c3List(d);
  let signalLine = '';
  if (c3.length){
    const armed = (d.verdict!=='ALT-OFF');
    signalLine = `<div class="indicator-explain ${armed?'good':'danger'}">🔔 ${esc(c3.join(' / '))} 連 ${s.c3_day||3} 天進 Top 3` + (armed?'，達標可進場':'，但框架 ALT-OFF，記錄觀察不進場') + (s.exits&&s.exits.length?` · ${esc(s.exits.join('/'))} 出場`:'') + `</div>`;
  }
  el.innerHTML =
    `<div class="card"><div class="head"><div class="title">🏆 今日強勢幣 Top 10</div><div class="meta">${win} 漲幅排序 · CoinGecko via Apify</div></div><div class="coin-grid">${cards}</div>${signalLine}</div>` +
    `<div class="card"><div class="head"><div class="title">📘 策略規則 (SOP)</div><div class="meta">連續 3 天 Top 3 才進場</div></div><div class="sop-grid">
      <div class="sop-box in"><div class="sop-h">✅ 進場</div><div class="sop-b">連續 <b>3 天</b>在 Top 3 → 買入，最多同時持有 5 個</div></div>
      <div class="sop-box out"><div class="sop-h">🚪 出場（任一）</div><div class="sop-b">① 掉出 Top 10<br>② 進場後高點回撤 <b>-20%</b>（高點需先 +5%）<br>③ 進場後 <b>-30%</b> 災難停損</div></div>
    </div><div class="indicator-explain warn">配置整體資產 5-10% 跑此策略。${win} 為動能視窗。</div></div>`;
}

async function boot(){
  tickClock(); setInterval(tickClock,30000);
  let d;
  try {
    const bust = '?t='+Date.now();
    d = await fetch('../outputs/today.json'+bust,{cache:'no-store'}).then(r=>r.json());
  } catch(e){
    document.getElementById('tab-sentiment').innerHTML='<div class="alert-banner danger"><span class="big">⚠</span><div>今日資料載入失敗（outputs/today.json）。routine 可能尚未產出或檔案異常。</div></div>';
    return;
  }
  document.getElementById('hdrDate').textContent = (d.date||'')+' ('+(d.weekday||'')+')';
  try { renderSentiment(d); } catch(e){ document.getElementById('tab-sentiment').innerHTML='<div class="alert-banner danger"><span class="big">⚠</span><div>X 情緒分頁渲染失敗</div></div>'; console.error(e); }
  try { renderStrong(d); } catch(e){ console.error(e); }
  try { renderBrief(d); } catch(e){ console.error(e); }
  document.getElementById('foot').textContent = '最近更新 '+(d.date||'')+' '+(d.updated_tpe||'')+' TPE · v6.1 資料驅動 · 排程 daily-crypto-x-sentiment';
}
boot();
</script>
