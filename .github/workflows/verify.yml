name: verify-routine-output
on:
  pull_request:
    paths:
      - 'outputs/sources_today.json'
      - 'outputs/today.json'
      - 'outputs/dominance_history.json'
      - 'dashboard/index.html'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python scripts/verify.py
